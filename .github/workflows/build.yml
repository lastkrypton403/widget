name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip projects
        run: |
          for z in ./*.zip; do
            unzip -q -o "$z" -d "unz/$(basename "$z" .zip)"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build every project found
        run: |
          for f in $(find unz -name 'settings.gradle*'); do
            (cd "$(dirname "$f")" && gradle assembleDebug --no-daemon)
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: unz/**/app/build/outputs/apk/debug/*.apk
